<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games log</title>
  <link rel="icon" href="favicon/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png?v=2">
  <link rel="manifest" href="favicon/site.webmanifest?v=2">
  <meta name="theme-color" content="#1b2032">
  <meta name="description" content="Every game I've played, month by month, since 2023.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1b2032;          /* deep slate, like a dim games room */
      --bg-raised: #242a40;
      --shelf: #343c5c;
      --text: #ece9f4;
      --muted: #9097b3;
      --sticker: #f5b83d;     /* amber, like a price sticker on a game case */
      --sticker-ink: #2a1d05;
      --platform: #5aa9ff;    /* blue sticker for the platform */
      --platform-ink: #04203f;
      --radius-cover: 6px;
      --cover-w: clamp(60px, 14.5vw, 160px);
      --font: "Bricolage Grotesque", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 85% -10%, #2b2f55 0%, transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.5;
      min-height: 100vh;
    }

    .wrap { max-width: 1440px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 3rem); }

    /* ---------- header ---------- */
    header.top { padding-top: clamp(2.5rem, 5vw, 4rem); padding-bottom: 1rem; }
    h1 {
      font-size: clamp(3.2rem, 8vw, 6rem);
      font-weight: 800;
      font-variation-settings: "wdth" 75;
      line-height: 0.88;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .intro { color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.2rem); margin: 1rem 0 0; max-width: 40ch; }

    /* ---------- year picker ---------- */
    .picker {
      position: sticky; top: 0; z-index: 20;
      padding: 0.75rem 0;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    .picker.stuck { border-bottom-color: var(--shelf); }
    .picker .wrap { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; justify-content: space-between; }
    /* year dropdown */
    .year-select { position: relative; }
    .year-btn {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font: inherit; font-size: 1.5rem; font-weight: 700;
      font-variation-settings: "wdth" 80;
      color: var(--text); background: var(--bg-raised);
      border: 1px solid var(--shelf); border-radius: 12px;
      padding: 0.35rem 0.8rem 0.35rem 1rem; cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .year-btn:hover { background: #2c3350; }
    .year-btn:focus-visible { outline: 3px solid var(--sticker); outline-offset: 2px; }
    .year-btn svg { width: 1rem; height: 1rem; transition: transform .2s; color: var(--muted); }
    .year-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
    .year-menu {
      position: absolute; top: calc(100% + 0.5rem); left: 0; z-index: 30;
      min-width: 15rem; margin: 0; padding: 0.4rem; list-style: none;
      background: var(--bg-raised); border: 1px solid var(--shelf); border-radius: 14px;
      box-shadow: 0 24px 48px -16px rgba(0,0,0,.8);
      transform-origin: top left;
      opacity: 0; transform: translateY(-6px) scale(.97); visibility: hidden;
      transition: opacity .15s, transform .18s cubic-bezier(.2,.8,.2,1), visibility 0s .18s;
    }
    .year-menu.open { opacity: 1; transform: none; visibility: visible; transition-delay: 0s; }
    .year-menu li {
      display: flex; align-items: baseline; justify-content: space-between; gap: 1.5rem;
      padding: 0.55rem 0.75rem; border-radius: 9px; cursor: pointer;
      font-size: 1.15rem; font-weight: 600;
    }
    .year-menu li .n { color: var(--muted); font-size: 0.9rem; font-weight: 400; }
    .year-menu li:hover, .year-menu li.active { background: #2f3756; }
    .year-menu li[aria-selected="true"] { background: var(--text); color: var(--bg); }
    .year-menu li[aria-selected="true"] .n { color: #4b5170; }
    .year-menu:focus { outline: none; }
    .tally { color: var(--muted); font-size: 0.95rem; margin: 0; }
    .tally strong { color: var(--text); font-weight: 700; }

    /* ---------- months ---------- */
    /* one row per month, January first; each row is a sideways-scrolling shelf */
    main { padding: 1rem 0 4rem; }
    .month {
      display: grid;
      grid-template-columns: 9rem minmax(0, 1fr);
      gap: 1.5rem;
      padding: 1.75rem 0 0;
    }
    .month-head { padding-top: 0.75rem; }
    .month h2 {
      font-size: 2rem; font-weight: 700;
      font-variation-settings: "wdth" 80;
      line-height: 1; margin: 0;
      letter-spacing: -0.01em;
    }
    .month .count { color: var(--muted); font-size: 0.9rem; margin: 0.35rem 0 0; }

    /* arrow buttons for mouse users */
    .arrows { display: flex; gap: 0.4rem; margin-top: 1rem; }
    .arrows button {
      width: 2.5rem; height: 2.5rem; border-radius: 50%;
      border: 1px solid var(--shelf); background: var(--bg-raised); color: var(--text);
      font: inherit; font-size: 1.1rem; line-height: 1; cursor: pointer;
      display: grid; place-items: center;
      transition: background .15s, opacity .15s;
    }
    .arrows button:hover:not(:disabled) { background: var(--shelf); }
    .arrows button:disabled { opacity: .3; cursor: default; }
    .arrows button:focus-visible { outline: 3px solid var(--sticker); outline-offset: 2px; }
    .month.fits .arrows { display: none; }

    /* the shelf: covers stand on a lit ledge */
    .shelf {
      display: flex; gap: 1.25rem;
      overflow-x: auto; overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      list-style: none; margin: 0;
      padding: 0.75rem 0 1.5rem;
      border-bottom: 2px solid var(--shelf);
      scrollbar-width: thin; scrollbar-color: var(--shelf) transparent;
    }
    .shelf::-webkit-scrollbar { height: 8px; }
    .shelf::-webkit-scrollbar-thumb { background: var(--shelf); border-radius: 8px; }
    /* fade the right edge while there's more to scroll to */
    .month.more-right .shelf { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 70px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 70px), transparent); }

    /* ---------- game ---------- */
    .game { margin: 0; flex: 0 0 var(--cover-w); scroll-snap-align: start; }
    .case { position: relative; }
    .cover {
      position: relative;
      aspect-ratio: 3 / 4;
      border-radius: var(--radius-cover);
      overflow: hidden;
      background: var(--bg-raised);
      box-shadow: 0 10px 24px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
      transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* thin sheen down the left edge, like the spine of a plastic case */
    .cover::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(255,255,255,.14) 0 2px, rgba(255,255,255,0) 10px);
      pointer-events: none;
    }
    .game:hover .cover, .game:focus-visible .cover, .game.open .cover {
      transform: translateY(-6px);
      box-shadow: 0 22px 34px -14px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.08);
    }

    /* fallback tile if an image is missing */
    .cover.blank {
      display: grid; place-items: center; padding: 1rem; text-align: center;
      background: linear-gradient(160deg, #3a4270, #23283f);
      font-weight: 700; font-size: 1.05rem; line-height: 1.15;
      font-variation-settings: "wdth" 85;
    }

    .game .name {
      margin: 0.6rem 0 0;
      font-size: 0.84rem; font-weight: 500; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* stickers that slap onto the case on hover: platform (blue) and note (amber) */
    .tags {
      position: absolute; left: 0.5rem; bottom: 0.9rem; right: 0.5rem; z-index: 2;
      display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem;
      pointer-events: none;
    }
    .tag {
      max-width: 100%;
      font-weight: 700; font-size: 0.72rem; line-height: 1.2;
      padding: 0.22rem 0.45rem;
      border-radius: 3px;
      box-shadow: 0 4px 10px -4px rgba(0,0,0,.6);
      opacity: 0;
      transition: transform .22s cubic-bezier(.3,1.6,.5,1), opacity .15s;
    }
    .platform { background: var(--platform); color: var(--platform-ink); transform: scale(.7); }
    .note { background: var(--sticker); color: var(--sticker-ink); transform: scale(.7); transition-delay: .04s; }
    .game:hover .tag, .game:focus-visible .tag, .game.open .tag { opacity: 1; }
    .game:hover .platform, .game:focus-visible .platform, .game.open .platform { transform: none; }
    .game:hover .note, .game:focus-visible .note, .game.open .note { transform: none; }
    /* small corner tab hints that a game has a note */
    .has-note .cover::before {
      content: ""; position: absolute; top: 0; right: 0; z-index: 1;
      border-style: solid; border-width: 0 22px 22px 0;
      border-color: transparent var(--sticker) transparent transparent;
      transition: opacity .15s;
    }
    .has-note:hover .cover::before, .has-note.open .cover::before { opacity: 0; }
    .has-tags { cursor: pointer; }
    .game:focus-visible { outline: none; }
    .game:focus-visible .cover { outline: 3px solid var(--sticker); outline-offset: 3px; }

    /* one entrance moment when a year loads */
    .game.enter { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 18ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    .empty { color: var(--muted); padding: 3rem 0; }

    footer { color: var(--muted); font-size: 0.85rem; padding: 2rem 0 3rem; }
    footer a { color: inherit; }

    /* ---------- mobile ---------- */
    @media (max-width: 720px) {
      .picker .wrap { gap: 0.5rem; }
      .tally { font-size: 0.9rem; }
      .month { display: block; padding-top: 1.75rem; }
      .month-head { display: flex; align-items: baseline; gap: 0.6rem; padding: 0; margin-bottom: 0.4rem; }
      .month h2 { font-size: 1.7rem; }
      .month .count { margin: 0; }
      .arrows { display: none; }
      .month.more-right .shelf { -webkit-mask-image: none; mask-image: none; }
      /* covers become a swipeable shelf, edge to edge */
      .shelf {
        gap: 0.9rem;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: clamp(1rem, 4vw, 3rem);
        margin: 0 calc(-1 * clamp(1rem, 4vw, 3rem));
        padding: 0.5rem clamp(1rem, 4vw, 3rem) 1.5rem;
        scrollbar-width: none;
      }
      .shelf::-webkit-scrollbar { display: none; }
      .game { flex: 0 0 38vw; max-width: 120px; }
      .game .name { font-size: 0.88rem; }
      .game:hover .cover { transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="top wrap">
    <h1>Games log</h1>
    <p class="intro">A monthly record of where my free time went.</p>
  </header>

  <nav class="picker" aria-label="Choose a year">
    <div class="wrap">
      <div class="year-select">
        <button type="button" class="year-btn" id="year-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="year-menu">
          <span id="year-label"></span>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>
        </button>
        <ul class="year-menu" id="year-menu" role="listbox" tabindex="-1" aria-label="Year"></ul>
      </div>
      <p class="tally" id="tally" aria-live="polite"></p>
    </div>
  </nav>

  <main class="wrap" id="log"></main>

  <footer class="wrap">
    Cover art from <a href="https://www.igdb.com" rel="noopener">IGDB</a>.
  </footer>

  <script>
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const btnEl = document.getElementById("year-btn");
    const labelEl = document.getElementById("year-label");
    const menuEl = document.getElementById("year-menu");
    const tallyEl = document.getElementById("tally");
    const logEl = document.getElementById("log");
    const cache = {};
    let manifest = {};

    async function getJSON(path) {
      const res = await fetch(path, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${path}: ${res.status}`);
      return res.json();
    }

    async function init() {
      try {
        const [years, man] = await Promise.all([
          getJSON("data/years.json"),
          getJSON("images/manifest.json").catch(() => ({})),
        ]);
        manifest = man;
        years.sort((a, b) => b - a);

        menuEl.innerHTML = years.map(y =>
          `<li role="option" id="opt-${y}" data-year="${y}"><span>${y}</span><span class="n"></span></li>`).join("");
        // load every year up front so the menu can show how many games each has
        years.forEach(async y => {
          try {
            if (!cache[y]) cache[y] = await getJSON(`data/${y}.json`);
            const n = countGames(cache[y].months);
            menuEl.querySelector(`#opt-${y} .n`).textContent = `${n} ${n === 1 ? "game" : "games"}`;
          } catch (e) {}
        });

        const fromHash = +location.hash.slice(1);
        show(years.includes(fromHash) ? fromHash : years[0]);
      } catch (err) {
        logEl.innerHTML = `<p class="empty">Couldn't load the game list (${err.message}). If you opened this file directly, run it through a local server instead.</p>`;
      }
    }

    async function show(year) {
      labelEl.textContent = year;
      for (const li of menuEl.children) li.setAttribute("aria-selected", li.dataset.year == year);
      if (!cache[year]) cache[year] = await getJSON(`data/${year}.json`);
      const data = cache[year];

      // January to December; skip months with nothing logged yet
      const months = data.months
        .filter(m => m.games && m.games.length)
        .sort((a, b) => MONTHS.indexOf(a.month) - MONTHS.indexOf(b.month));

      const unique = countGames(months);
      tallyEl.innerHTML = `<strong>${unique}</strong> different games in ${year}`;

      if (!months.length) {
        logEl.innerHTML = `<p class="empty">Nothing logged for ${year} yet.</p>`;
        return;
      }

      let i = 0;
      logEl.innerHTML = months.map(m => `
        <section class="month" aria-labelledby="m-${year}-${m.month}">
          <div class="month-head">
            <h2 id="m-${year}-${m.month}">${m.month}</h2>
            <p class="count">${m.games.length} ${m.games.length === 1 ? "game" : "games"}</p>
            <div class="arrows">
              <button type="button" data-dir="-1" aria-label="Scroll ${m.month} left">&#8592;</button>
              <button type="button" data-dir="1" aria-label="Scroll ${m.month} right">&#8594;</button>
            </div>
          </div>
          <ul class="shelf">
            ${m.games.map(g => card(g, i++)).join("")}
          </ul>
        </section>`).join("");
      logEl.querySelectorAll(".month").forEach(updateRow);
    }

    function countGames(months) {
      return new Set(months.flatMap(m => (m.games || []).map(g => g.name))).size;
    }

    // ---------- year dropdown ----------
    const options = () => [...menuEl.children];
    let active = -1;
    function setActive(i) {
      const opts = options();
      active = (i + opts.length) % opts.length;
      opts.forEach((o, j) => o.classList.toggle("active", j === active));
      menuEl.setAttribute("aria-activedescendant", opts[active].id);
      opts[active].scrollIntoView({ block: "nearest" });
    }
    function openMenu() {
      menuEl.classList.add("open");
      btnEl.setAttribute("aria-expanded", "true");
      setActive(Math.max(0, options().findIndex(o => o.getAttribute("aria-selected") === "true")));
      menuEl.focus();
    }
    function closeMenu(focusButton = true) {
      menuEl.classList.remove("open");
      btnEl.setAttribute("aria-expanded", "false");
      if (focusButton) btnEl.focus();
    }
    function choose(li) {
      const y = +li.dataset.year;
      history.replaceState(null, "", "#" + y);
      closeMenu();
      show(y);
    }
    btnEl.addEventListener("click", () => menuEl.classList.contains("open") ? closeMenu() : openMenu());
    btnEl.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); openMenu(); }
    });
    menuEl.addEventListener("click", e => { const li = e.target.closest("li"); if (li) choose(li); });
    menuEl.addEventListener("mousemove", e => {
      const li = e.target.closest("li"); if (li) setActive(options().indexOf(li));
    });
    menuEl.addEventListener("keydown", e => {
      if (e.key === "ArrowDown") { e.preventDefault(); setActive(active + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
      else if (e.key === "Home") { e.preventDefault(); setActive(0); }
      else if (e.key === "End") { e.preventDefault(); setActive(options().length - 1); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(options()[active]); }
      else if (e.key === "Escape" || e.key === "Tab") { closeMenu(e.key === "Escape"); }
    });
    document.addEventListener("click", e => {
      if (menuEl.classList.contains("open") && !e.target.closest(".year-select")) closeMenu(false);
    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function card(game, i) {
      const entry = manifest[game.name];
      const name = esc(game.name);
      const cover = entry
        ? `<img src="${esc(entry.file)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('blank');this.replaceWith(document.createTextNode(${esc(JSON.stringify(game.name))}))">`
        : name;
      const tags = [
        game.platform && `<span class="tag platform">${esc(game.platform)}</span>`,
        game.note && `<span class="tag note">${esc(game.note)}</span>`,
      ].filter(Boolean);
      const label = [game.name, game.platform, game.note].filter(Boolean).map(esc).join(", ");
      const classes = ["game", "enter", tags.length && "has-tags", game.note && "has-note"].filter(Boolean).join(" ");
      const attrs = tags.length ? ` tabindex="0" aria-label="${label}"` : "";
      return `
        <li class="${classes}" style="--i:${Math.min(i, 40)}"${attrs}>
          <div class="case">
            <div class="cover${entry ? "" : " blank"}">${cover}</div>
            ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
          </div>
          <p class="name">${name}</p>
        </li>`;
    }

    // arrows, edge fade and disabled states for each row
    function updateRow(month) {
      const shelf = month.querySelector(".shelf");
      const max = shelf.scrollWidth - shelf.clientWidth;
      const [left, right] = month.querySelectorAll(".arrows button");
      month.classList.toggle("fits", max <= 2);
      month.classList.toggle("more-right", shelf.scrollLeft < max - 2);
      left.disabled = shelf.scrollLeft <= 2;
      right.disabled = shelf.scrollLeft >= max - 2;
    }
    logEl.addEventListener("scroll", e => {
      if (e.target.classList && e.target.classList.contains("shelf")) updateRow(e.target.closest(".month"));
    }, true);
    window.addEventListener("resize", () => logEl.querySelectorAll(".month").forEach(updateRow));
    logEl.addEventListener("click", e => {
      const btn = e.target.closest(".arrows button");
      if (!btn) return;
      const shelf = btn.closest(".month").querySelector(".shelf");
      shelf.scrollBy({ left: btn.dataset.dir * shelf.clientWidth * 0.8, behavior: "smooth" });
    });

    // tap to show the stickers on touch screens (no hover there)
    logEl.addEventListener("click", e => {
      const g = e.target.closest(".has-tags");
      document.querySelectorAll(".game.open").forEach(o => { if (o !== g) o.classList.remove("open"); });
      if (g) g.classList.toggle("open");
    });
    logEl.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches(".has-tags")) {
        e.preventDefault(); e.target.classList.toggle("open");
      }
    });

    // border under the year picker once it sticks
    const picker = document.querySelector(".picker");
    new IntersectionObserver(([e]) => picker.classList.toggle("stuck", e.intersectionRatio < 1),
      { threshold: [1], rootMargin: "-1px 0px 0px 0px" }).observe(picker);

    init();
  </script>
</body>
</html>
